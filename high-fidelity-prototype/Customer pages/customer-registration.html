<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../styles.css">
    <title>Customer Registration</title>
</head>
<body>
    <h1>Customer Registration</h1>
    <div class="card background-grey m-3 p-2">
        <p>First Name: <input type="text" placeholder="EX: Clark"></input> </p>
        <p>Last Name: <input type="text" placeholder="EX: Kent"></input> </p>
        <p>Primary Location: <input type="text" placeholder="EX: Greensboro, NC"> </input></p>
        <p>Email: <input type="email" placeholder="EX: clark.kent@thedailybugle.com"></input> </p>
        <p>Phone: <input type="tel" placeholder="EX: (987) 654-3210"></input> </p>
        <h2>Bio:</h2>
        <textarea style="height: 100px;" class="form-control" placeholder="Enter a brief bio about yourself.">Investigative Journalist at the Daily Bugle, originally from Smallville, Kansas. I didn't get to travel a lot until I was offered my position at the Daily Bugle. While I go get to see a lot of interesting places, it's rare they have anything to do with my hobbies, so I would like to find people to show me what there is to do in Greensboro that align with my interests. I love nature, arcades, and pickleball.</textarea>
        <a class="btn btn-primary" href="customer-profile.html">Create Profile</a>
    </div>    
</body>
</html>
