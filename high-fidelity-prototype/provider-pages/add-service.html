<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles.css">
    <title>Add Service</title>
</head>

<body>
    <h1>Add Service</h1>
    <nav class="navbar m-3 p-2">
        <a class="navbar-brand" href="provider-profile.html">Profile</a>
        <a class="navbar-brand" href="add-service.html">Add a Service</a>
        <a class="navbar-brand" href="provider-dashboard.html">Dashboard</a>
        <a class="navbar-brand" href="../login.html">Logout</a>
    </nav>
    <div class="card background-grey m-3 p-2">
        <h5>Title: <input type="text" placeholder="EX: Nature Tour"></input> </h5>
        <p>Location: <input type="text" placeholder="EX: Greensboro, NC"> </input></p>
        <p>Image link: <input type="url" placeholder="EX: linktonaturepic.com/pretty-flowers.jpeg"> </input></p>
        <h2>Description:</h2>
        <textarea style="height: 100px;" class="form-control"
            placeholder="Enter A description of this service."></textarea>
        <p>Price: <input type="text" placeholder="EX: $50.00"> </input></p>
        <p>Duration: <input type="text" placeholder="EX: 3 hours"> </input></p>
        <p>Max Group Size: <input type="text" placeholder="EX: 10 people"> </input></p>
        <a class="btn btn-primary" href="nature-tour.html">Add Service</a>
    </div>

</body>

</html>
