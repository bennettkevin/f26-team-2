<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Provider Profile</title>
</head>

<body>
    <h1>John Doe</h1>
    <p>Location: Greensboro, NC</p>
    <div class="container">
        <div class="card">
            <h2>Tour Services</h2>
            <ul>
                <li><a href="./nature-tour.html">Nature Tour</a></li>
                <li>History Tour</li>
                <li>Art Tour</li>
            </ul>
        </div>
        <div class="card">
            <h2>Bio</h2>
            <textarea type="text-box" class="form-control" style="height: 100px;">Hello, I am John Doe and I provide tours of different types in Greensboro, NC. I have been providing tours for over 5 years and have a passion for sharing the culture and history of our beautiful city. I specialize in nature tours, however, I also offer history and art tours. My goal is to provide an enjoyable and education experience for all. Please feel free to reach out to me for more information and leave a review of your experience.</textarea>
        </div>
        <div class="card">
            <h2>Contact Information:</h2>
            <p>Email:<input type="email" class="form-control" value="john.doe@example.com"></input></p>
            <p>Phone: <input type="tel" class="form-control" value="(123) 456-7890"></input></p>
        </div>
        <a class="btn btn-secondary" href="provider-profile.html">Save Changes</a>
    </div>
</body>

</html>
