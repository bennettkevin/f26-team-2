<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../styles.css">
    <title>Provider Registration</title>
</head>
<body>
    <h1>Provider Registration</h1>
    <div class="card background-grey m-3 p-2">
        <p>First Name: <input type="text" placeholder="EX: John"></input> </p>
        <p>Last Name: <input type="text" placeholder="EX: Doe"></input> </p>
        <p>Primary Location: <input type="text" placeholder="EX: Greensboro, NC"> </input></p>
        <p>Email: <input type="email" placeholder="EX: john.doe@example.com"></input> </p>
        <p>Phone: <input type="tel" placeholder="EX: (123) 456-7890"></input> </p>
        <h2>Bio:</h2>
        <textarea style="height: 100px;" class="form-control" placeholder="Enter a brief bio about yourself."></textarea>
        <a class="btn btn-primary" href="provider-profile.html">Create Profile</a>
    </div>
</body>
</html>
