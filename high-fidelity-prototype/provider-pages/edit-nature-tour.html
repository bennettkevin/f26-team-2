    <title>Add Service</title>

<body>
    <h1>Add Service</h1>
    <div class="card background-grey m-3 p-2">
        <h5>Title: <input type="text" value="Nature Tour"></input> </h5>
        <p>Location: <input type="text" value="Greensboro, NC"> </input></p>
        <p>Image link: <input type="url" value="provider-images/nature-tour.jpeg"> </input></p>
        <h2>Description:</h2>
        <textarea style="height: 25rem;"
            class="form-control">This is a guided tour of the natural attractions in and around Greensboro, NC. The tour will take you through beautiful parks, lakes, and nature trails, where you can enjoy the local ecosystem and wildlife. Led by John Doe, an experienced tour guide, this tour is perfect for nature enthusiasts or anyone looking to explore the ourdoors and what they have to offer in Greensboro. The tour will last approximately 3 hours and will include stops at several key locations, where you may take photos, take in nature, and learn about the local wildlife.</textarea>
        <p>Price: <input type="text" value="$50.00"> </input></p>
        <p>Duration: <input type="text" value="3 hours"> </input></p>
        <p>Max Group Size: <input type="text" value="10 people"> </input></p>
    </div>
    <a class="btn btn-primary" href="nature-tour.html">Save Changes</a>
</body>
